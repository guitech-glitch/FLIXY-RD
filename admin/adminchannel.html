<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Nuvix</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #000000;    
            --card: #1e293b; 
            --text: #f8fafc; 
            --accent: #3b82f6; 
            --danger: #ef4444; 
            --success: #22c55e; 
            --warning: #f59e0b;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; margin: 0; }
        .container { width: 98%; max-width: 1000px; margin: auto; padding-top: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .search-container { position: relative; width: 100%; margin-bottom: 15px; }
        #channelSearch { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; 
            background: #0f172a; color: white; font-size: 16px; outline: none; box-sizing: border-box;
        }
        .group-wrapper { overflow-x: auto; white-space: nowrap; padding: 10px 0; margin-bottom: 10px; scrollbar-width: none; display: flex; align-items: center; gap: 8px; }
        .group-wrapper::-webkit-scrollbar { display: none; }
        .btn-group { 
            display: inline-block; padding: 8px 16px; background: var(--card); 
            border: 1px solid #334155; border-radius: 20px; color: var(--text); cursor: pointer; font-size: 12px;
            flex-shrink: 0;
        }
        .btn-group.active { background: var(--primary); border-color: var(--primary); font-weight: bold; }
        .btn-offline { border: 1px solid var(--danger); color: var(--danger); }
        .btn-offline.active { background: var(--danger); color: white; }
        .status-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 15px; background: #1e293b; padding: 10px 15px; 
            border-radius: 8px; border: 1px solid #334155; gap: 10px;
        }
        .user-counter { font-size: 0.9rem; font-weight: bold; color: #94a3b8; }
        .btn-add-main { background: var(--success); color: white; padding: 10px 20px; font-size: 0.85rem; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .table-container { width: 100%; overflow-x: auto; background: var(--card); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.85rem; }
        th { background: #334155; color: #94a3b8; text-transform: uppercase; font-size: 0.7rem; }
        .channel-logo { width: 35px; height: 35px; object-fit: contain; background: #000; border-radius: 4px; display: block; }
        .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; }
        .online { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .offline { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .testing { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
        .btn-edit { background: var(--accent); color: white; border:none; padding: 6px 12px; border-radius:4px; cursor:pointer; font-size: 0.75rem; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; padding: 10px 0; }
        .btn-page { background: var(--card); border: 1px solid #334155; color: white; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }
        #page-info { font-size: 0.85rem; color: #94a3b8; }
        
        /* MODALES */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #3b82f6; z-index: 1000; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 500; }
        
        .form-group { margin-bottom: 12px; }
        label { font-size: 0.65rem; color: #3b82f6; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        #preview-box { width: 100%; height: 180px; background: #000; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #334155; }
        video { width: 100%; height: 100%; }
        
        /* BOTONES ACCION */
        .btn-save { background: var(--success); color: white; width: 100%; padding: 12px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; margin-top: 10px;}
        .btn-delete { background: var(--danger); color: white; width: 100%; padding: 10px; border:none; border-radius:4px; margin-top: 8px; cursor:pointer; font-weight: bold;}
        .btn-cancel { background: transparent; color: #94a3b8; width: 100%; padding: 10px; border:none; border-radius:4px; cursor:pointer; font-size: 0.8rem; margin-top: 5px; }
        
        /* ESTILOS CONFIRMACION ELIMINAR */
        #deleteConfirmModal { border-color: var(--danger); z-index: 1100; text-align: center; }
        .modal-open-blur { filter: blur(4px); pointer-events: none; transition: filter 0.2s; }

        #notification-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 400px; }
        .toast { background: #1e293b; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid var(--primary); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); display: flex; justify-content: space-between; align-items: center; animation: slideDown 0.3s ease-out; }
        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: var(--warning); }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="notification-container"></div>

<div class="container">
    <div class="header"><h1></h1><div style="font-size: 0.7rem; color: #64748b;">PBy Gi Tech</div></div>
    <div class="search-container"><input type="text" id="channelSearch" placeholder="Buscar canal..." oninput="filterSearch()"></div>
    <div class="status-bar">
        <div class="user-counter">Canales: <span id="currentCount">0</span> / 2000</div>
        <button class="btn-add-main" onclick="openAddModal()">+ AGREGAR CANAL</button>
    </div>
    <div class="group-wrapper" id="group-buttons"></div>
    <div class="table-container">
        <table> 
            <thead><tr><th>Logo</th><th>Nombre</th><th>Grupo</th><th>Estado</th><th style="text-align: center;">Acción</th></tr></thead>
            <tbody id="channelTable"></tbody>

    </div>
    <div class="pagination">
        <button id="btn-prev" class="btn-page" onclick="changePage(-1)">Anterior</button>
        <span id="page-info">Página 1</span>
        <button id="btn-next" class="btn-page" onclick="changePage(1)">Siguiente</button>

</div>

<div id="overlay" class="overlay" onclick="closeModal()"></div>

<option value="FHD">4K / FULL HD</option>

<option value="SD">SD (BAJO CONSUMO)</option>
        </select>
    </div>
    <div class="form-group"><label>URL del Logo</label><input type="text" id="mLogo"></div>
    <div class="form-group"><label>URL .m3u8</label><input type="text" id="mUrl" oninput="testUrl(this.value)"></div>
    <button class="btn-save" id="btnSave" onclick="saveChannel()">GUARDAR CAMBIOS</button>
    <button id="btnDelete" class="btn-delete" onclick="openDeleteConfirm()">ELIMINAR CANAL</button>
    <button class="btn-cancel" onclick="closeModal()">CANCELAR / CERRAR</button>
</div>

<div id="deleteConfirmModal" class="modal">
    <div style="padding: 10px;">
        <div style="font-size: 2.5rem; margin-bottom: 10px;">⚠️</div>

        </p>
        <div style="margin-top: 20px;">
            <button class="btn-delete" id="confirmDeleteBtn" style="margin-top:0; width: 100%;">SÍ, ELIMINAR</button>
            <button class="btn-cancel" onclick="closeDeleteModal()" style="font-weight: bold; margin-top: 10px;">CANCELAR</button>
        </div>
    </div>
</div>
